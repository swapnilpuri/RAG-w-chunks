spring.application.name=demorag

server.port=8081

# Gemini AI Configuration

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.5

spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}

# Spring AI Embedding Configuration (CRITICAL!)
spring.ai.embedding.client=google-genai
spring.ai.google.genai.embedding.enabled=true
spring.ai.google.genai.embedding.options.model=gemini-embedding-001


# Vector store configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=${DB_USERNAME:rag_user}
spring.datasource.password=${DB_PASSWORD:rag_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings for better performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false



spring.ai.vectorstore.pgvector.index-type=HNSW
#Replace the COSINE_DISTANCE with NEGATIVE_INNER_PRODUCT, as it was fetching irrelevant documents from DB.
spring.ai.vectorstore.pgvector.distance-type=NEGATIVE_INNER_PRODUCT 
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.max-document-batch-size=10000
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=document_chunks
spring.ai.vectorstore.pgvector.initialize-schema=false

# RAG Retrieval Configuration
rag.retrieval.top-k=5
rag.retrieval.similarity-threshold=0.3

# Whether to fetch adjacent chunks for better context continuity
# When true, fetches chunks before and after the matched chunks
rag.retrieval.fetch-adjacent-chunks=true

# Number of adjacent chunks to fetch (on each side)
rag.retrieval.adjacent-chunk-count=1

# Whether to rerank chunks after retrieval (future feature)
rag.retrieval.enable-reranking=false

# ==========================================
# Chunking Configuration (for ingestion)
# ==========================================

chunking.chunk-size=1000
chunking.chunk-overlap=200
chunking.buffer-size=8192

# ==========================================
# Logging Configuration
# ==========================================

logging.level.com.rag.learning.demorag=INFO
logging.level.com.rag.learning.demorag.service.RagService=DEBUG
logging.level.com.rag.learning.demorag.service.EnhancedRagService=DEBUG
logging.level.com.rag.learning.demorag.service.EmbeddingService=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.org.springframework.ai.vectorstore.pgvector=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN


# ==========================================
# Embedding Configuration (Gemini) - FOR QUERIES
# ==========================================

# General Embedding Settings
embedding.dimension=3072
embedding.max-input-length=10000
embedding.batch-size=10

# Gemini API Configuration (reuse same as ingestion)
embedding.gemini.api-key=${GOOGLE_API_KEY}
embedding.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
embedding.gemini.connect-timeout=30000
embedding.gemini.read-timeout=30000
embedding.gemini.write-timeout=30000
embedding.gemini.max-retries=3
embedding.gemini.retry-delay-ms=1000