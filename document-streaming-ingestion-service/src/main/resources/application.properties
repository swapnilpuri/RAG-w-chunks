# Application Name
spring.application.name=document-ingestion-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=rag_user
spring.datasource.password=rag_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File Monitoring Configuration
file.monitor.input-folder=./input
file.monitor.archive-folder=./archive
file.monitor.failure-folder=./failure
file.monitor.poll-interval=5000

# Camel Configuration
camel.springboot.main-run-controller=true
camel.springboot.name=document-ingestion-service

document.input.path=./input
document.archive.path=./archive
document.failure.path=./failure
document.poll-interval=5000

# ==========================================
# Embedding Configuration (Gemini)
# ==========================================

# General Embedding Settings
embedding.dimension=3072
embedding.max-input-length=10000
embedding.batch-size=10

# Gemini API Configuration
embedding.gemini.api-key=${GOOGLE_API_KEY}
# The URL includes the model name (text-embedding-004)
embedding.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
embedding.gemini.connect-timeout=30000
embedding.gemini.read-timeout=30000
embedding.gemini.write-timeout=30000
embedding.gemini.max-retries=3
embedding.gemini.retry-delay-ms=1000

# ==========================================

# Logging
logging.level.org.apache.camel=INFO
logging.level.com.example=DEBUG