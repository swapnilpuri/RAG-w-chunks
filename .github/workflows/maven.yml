# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  actions: read
  security-events: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    # Build demorag module
    - name: Build demorag with Maven
      run: mvn -B package --file demorag/pom.xml
    
    - name: Verify demorag build
      run: |
        if [ ! -d "demorag/target" ] || [ -z "$(find demorag/target -name '*.jar' -type f)" ]; then
          echo "Demorag build failed - no jar file found in target directory"
          exit 1
        fi
        echo "Demorag build successful"
    
    # Build document-streaming-ingestion-service module
    - name: Build document-streaming-ingestion-service with Maven
      run: mvn -B package --file document-streaming-ingestion-service/pom.xml
    
    - name: Verify document-streaming-ingestion-service build
      run: |
        if [ ! -d "document-streaming-ingestion-service/target" ] || [ -z "$(find document-streaming-ingestion-service/target -name '*.jar' -type f)" ]; then
          echo "Document-streaming-ingestion-service build failed - no jar file found in target directory"
          exit 1
        fi
        echo "Document-streaming-ingestion-service build successful"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Check dependency graph support
      id: check-dependency-graph
      run: |
        echo "Checking if dependency graph submission is supported..."
        # This step will help identify if the repository has the necessary features enabled
        echo "Repository: ${{ github.repository }}"
        echo "Token permissions should include contents:write for dependency graph submission"
        echo "dependency-graph-supported=true" >> $GITHUB_OUTPUT
      continue-on-error: true
    
    - name: Update dependency graph for demorag
      if: steps.check-dependency-graph.outputs.dependency-graph-supported == 'true'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      continue-on-error: true
      with:
        directory: demorag
    
    - name: Update dependency graph for document-streaming-ingestion-service
      if: steps.check-dependency-graph.outputs.dependency-graph-supported == 'true'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      continue-on-error: true
      with:
        directory: document-streaming-ingestion-service
